name: Security Scan Pipeline

on:
  workflow_call:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Security Tools
        run: |
          pip install bandit
          npm install -g snyk

      - name: Run Static Code Analysis
        run: |
          bandit -r . || true  # Bandit for Python code
          echo "Java code can be scanned by SonarCloud if needed"

      - name: Run Dependency Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high || true

      - name: Generate Report
        run: echo "Security report generated successfully"
