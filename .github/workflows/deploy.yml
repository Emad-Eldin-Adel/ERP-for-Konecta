name: Build & Push Microservices Docker Images to AWS ECR

on:
  push:
    branches: [ "production" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push Docker Images
      run: |
        # Map services to ECR repos
        declare -A MAP
        MAP[frontend]="app1_repo"
        MAP[api-gateway]="app2_repo"
        MAP[auth-service]="app3_repo"
        MAP[config]="app4_repo"
        MAP[discovery]="app5_repo"
        MAP[finance-service]="app6_repo"
        MAP[hr-service]="app7_repo"
        MAP[inventory-service]="app8_repo"
        MAP[report-service]="app9_repo"

        # Determine changed files
        if [ -z "${GITHUB_EVENT_BEFORE}" ] || [ "${GITHUB_EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
          echo "⚪ First commit detected or new branch, building all Dockerfiles"
          CHANGED_FILES=$(git ls-files)
        else
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        fi

        # Loop over all services
        for SERVICE in "${!MAP[@]}"; do
          if [ "$SERVICE" == "frontend" ]; then
            SERVICE_PATH="src/frontend"
          else
            SERVICE_PATH="src/backend/$SERVICE"
          fi

          DOCKERFILE_PATH="$SERVICE_PATH/Dockerfile"
          REPO="${MAP[$SERVICE]}"
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO:latest"

          # Skip services without Dockerfile
          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "⚪ Skipping $SERVICE (Dockerfile not found)"
            continue
          fi

          # Build & push frontend if any file changed in its folder
          if [ "$SERVICE" == "frontend" ]; then
            if echo "$CHANGED_FILES" | grep -q "^$SERVICE_PATH/"; then
              echo "🔵 Building frontend → $IMAGE"
              docker build -t $IMAGE "$SERVICE_PATH"
              echo "🚀 Pushing frontend to $REPO"
              docker push $IMAGE
            else
              echo "⚪ Skipping frontend (no changes)"
            fi
          else
            # Build & push backend service only if Dockerfile changed
            if echo "$CHANGED_FILES" | grep -q "^$DOCKERFILE_PATH$"; then
              echo "🔵 Building service: $SERVICE → $IMAGE"
              docker build -t $IMAGE "$SERVICE_PATH"
              echo "🚀 Pushing $SERVICE to $REPO"
              docker push $IMAGE
            else
              echo "⚪ Skipping $SERVICE (Dockerfile not changed)"
            fi
          fi
        done
