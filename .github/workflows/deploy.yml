name: Build & Push Microservices to AWS ECR

on:
  push:
    branches: [ "production" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push Docker Images
      run: |
        declare -A MAP

        # Microservice-to-repo mapping
        MAP[api-geteway]="app2_repo"
        MAP[auth-service]="app3_repo"
        MAP[config]="app4_repo"
        MAP[discovery]="app5_repo"
        MAP[finance-service]="app6_repo"
        MAP[hr-service]="app7_repo"
        MAP[inventory-service]="app8_repo"
        MAP[report-service]="app9_repo"

        for SERVICE in "${!MAP[@]}"; do
          REPO="${MAP[$SERVICE]}"
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO:latest"

          echo "🔵 Building service: $SERVICE → $IMAGE"

          docker build -t $IMAGE "./src/$SERVICE"

          echo "🚀 Pushing $SERVICE to $REPO"
          docker push $IMAGE
        done
