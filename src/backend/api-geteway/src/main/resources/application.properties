spring.application.name=api-gateway
server.port=8080
# Register with Eureka
eureka.client.service-url.defaultZone=http://discovery:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable actuator endpoints
management.endpoints.web.exposure.include=*

# Gateway Routes
spring.cloud.gateway.discovery.locator.enabled=false

# Auth service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# HR service
spring.cloud.gateway.routes[1].id=hr-service
spring.cloud.gateway.routes[1].uri=http://hr-service:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/hr/**


# Finance service
spring.cloud.gateway.routes[2].id=finance-service
spring.cloud.gateway.routes[2].uri=http://finance-service:5288
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/finance/**


# Inventory service
spring.cloud.gateway.routes[3].id=inventory-service
spring.cloud.gateway.routes[3].uri=http://inventory-service:8094
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventory/**

# Proxy upstreams (override with env vars if needed)
app.proxy.auth-base-url=${AUTH_SERVICE_URL:http://auth-service:8081/api/auth}
app.proxy.hr-base-url=${HR_SERVICE_URL:http://hr-service:8083/api/hr}
app.proxy.finance-base-url=${FINANCE_SERVICE_URL:http://finance-service:5288/api/finance}
app.proxy.inventory-base-url=${INVENTORY_SERVICE_URL:http://inventory-service:8094/api/inventory}
app.proxy.reporting-base-url=${REPORT_SERVICE_URL:http://report-service:8080/api/reporting}

# CORS: set explicit origins; defaults are safe for local dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Uses allowedOriginPatterns to support wildcard + credentials; comma-separated list
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
