server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: admin-service
          uri: lb://user-management
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        - id: hr-service
          uri: lb://hr-service
          predicates:
            - Path=/api/hr/**
          filters:
            - StripPrefix=1
        - id: finance-service
          uri: lb://finance-service
          predicates:
            - Path=/api/finance/**
          filters:
            - StripPrefix=1
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/employee/**
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery:8761/eureka/

app:
  jwt:
    secret: TdOGaOOEmgibACqaax9trGLJMu5y6uv4q8pxDxXY4fuPKoGH67sIwQHC6khsubmgB5nzuR-Q5py2hKCdBsH0eg
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/logout
      - /actuator/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
    role-routes:
      - pattern: /api/admin/**
        roles: [ADMIN]
      - pattern: /api/hr/**
        roles: [HR, ADMIN]
      - pattern: /api/finance/**
        roles: [FINANCE, ADMIN]
