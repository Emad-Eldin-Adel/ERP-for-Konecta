<section class="rounded-3xl border border-slate-200 bg-white/95 p-6 shadow-sm space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Departments</h2>
      <p class="text-sm text-slate-500">Organize teams and assign hiring ownership.</p>
    </div>
    <button class="rounded-xl bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-700" (click)="startCreate()">
      + New department
    </button>
  </div>
  <div *ngIf="error()" class="rounded-xl border border-red-200 bg-red-50 px-4 py-2 text-sm font-medium text-red-700">
    {{ error() }}
  </div>
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200 text-sm">
      <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
        <tr>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Description</th>
          <th class="px-4 py-3">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <tr *ngFor="let dept of departments()">
          <td class="px-4 py-3 font-semibold text-slate-900">{{ dept.name }}</td>
          <td class="px-4 py-3 text-slate-600">{{ dept.description || '—' }}</td>
          <td class="px-4 py-3 space-x-2">
            <button class="rounded-lg border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600 hover:border-primary-200 hover:text-primary-600" (click)="startEdit(dept)">Edit</button>
            <button class="rounded-lg border border-red-200 px-3 py-1 text-xs font-semibold text-red-600 hover:bg-red-50" (click)="delete(dept)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="departments().length === 0">
          <td colspan="3" class="px-4 py-6 text-center text-sm text-slate-500">No departments yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<div *ngIf="modalOpen()" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
      <div>
        <h3 class="text-lg font-semibold text-slate-900">{{ editing() ? 'Edit department' : 'New department' }}</h3>
        <p class="text-sm text-slate-500">Define team scope and responsibilities.</p>
      </div>
      <button class="rounded-full p-2 text-slate-400 hover:bg-slate-100" (click)="modalOpen.set(false)">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    <form class="space-y-4 px-6 py-5" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="text-sm font-medium text-slate-700">Name</label>
        <input type="text" formControlName="name" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Description</label>
        <textarea rows="3" formControlName="description" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100"></textarea>
      </div>
      <div *ngIf="formError()" class="rounded-xl border border-red-200 bg-red-50 px-4 py-2 text-sm font-medium text-red-700">
        {{ formError() }}
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50" (click)="modalOpen.set(false)">
          Cancel
        </button>
        <button type="submit" class="rounded-xl bg-primary-600 px-5 py-2 text-sm font-semibold text-white shadow-lg shadow-primary-500/30 hover:bg-primary-700">
          {{ submitting() ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
