<section class="rounded-3xl border border-slate-200 bg-white/95 p-6 shadow-sm space-y-5">
  <header>
    <h2 class="text-xl font-semibold text-slate-900">Performance reviews</h2>
    <p class="text-sm text-slate-500">Track coaching moments and ratings.</p>
  </header>

  <form class="grid gap-4 md:grid-cols-4" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="text-sm font-medium text-slate-700">Employee ID</label>
      <input type="number" formControlName="employeeId" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Rating (1-5)</label>
      <input type="number" min="1" max="5" formControlName="rating" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Review date</label>
      <input type="date" formControlName="reviewDate" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100" />
    </div>
    <div class="flex items-end">
      <button type="submit" class="w-full rounded-xl bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-700">
        {{ submitting() ? 'Saving…' : 'Record review' }}
      </button>
    </div>
    <div class="md:col-span-4">
      <label class="text-sm font-medium text-slate-700">Feedback</label>
      <textarea rows="2" formControlName="feedback" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-primary-500 focus:ring-4 focus:ring-primary-100"></textarea>
    </div>
  </form>

  <div class="flex justify-between text-sm text-slate-500">
    <button type="button" class="rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold hover:border-primary-200 hover:text-primary-600" (click)="fetch()">Refresh history</button>
    <span *ngIf="error()" class="text-red-600">{{ error() }}</span>
  </div>

  <div class="rounded-2xl border border-slate-200">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-4 py-3">Review date</th>
            <th class="px-4 py-3">Rating</th>
            <th class="px-4 py-3">Feedback</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr *ngFor="let entry of entries()">
            <td class="px-4 py-3 font-semibold text-slate-900">{{ entry.reviewDate }}</td>
            <td class="px-4 py-3">
              <span class="rounded-full bg-primary-50 px-2 py-0.5 text-xs font-semibold text-primary-700">{{ entry.rating }}/5</span>
            </td>
            <td class="px-4 py-3 text-slate-600">{{ entry.feedback || '—' }}</td>
          </tr>
          <tr *ngIf="entries().length === 0">
            <td colspan="3" class="px-4 py-6 text-center text-sm text-slate-500">No reviews captured yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
