<nav class="fixed inset-x-0 top-0 z-50 px-4 py-3 sm:px-6 lg:px-10">
  <div class="pointer-events-none absolute inset-x-0 top-[-120px] h-[180px] bg-gradient-to-r from-white via-primary-50/70 to-accent-yellow/25 blur-3xl"></div>
  <div
    class="relative flex items-center justify-between gap-6 rounded-3xl border px-4 py-3 sm:px-6 backdrop-blur-xl"
    [ngClass]="[
      'bg-white/92 text-slate-900 border-slate-200/70 shadow-[0_14px_40px_rgba(15,23,42,0.08)]'
    ]"
    aria-label="Global navigation"
  >
    <div class="flex items-center gap-5">
      <a
        routerLink="/"
        class="group relative flex items-center gap-3 no-underline"
        [ngClass]="brandOn ? 'text-primary-800' : 'text-primary-700'"
        aria-label="Konecta One home link"
      >
        <img
          src="/user-network-logo.svg"
          alt="Konecta network logo"
          class="h-12 w-12 rounded-2xl border border-accent-yellow/30 bg-white p-2 shadow-inner ring-1 ring-primary-100"
          loading="lazy"
          draggable="false"
        />
        <span class="flex flex-col leading-tight text-left">
          <span class="text-sm font-semibold uppercase tracking-[0.18em] text-primary-600">Konecta</span>
          <span class="text-xl font-black text-slate-900">One</span>
        </span>
      </a>
      <div class="flex items-center gap-3">
        <ng-container *ngIf="!role && (isHomeRoute || isAuthRoute)">
          <a routerLink="/" class="text-sm font-medium rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-slate-800 hover:bg-accent-yellow hover:text-primary-900'">Home</a>
          <a [routerLink]="['/']" fragment="about" class="text-sm font-medium rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-slate-800 hover:bg-accent-yellow hover:text-primary-900'">About</a>
        </ng-container>

        <div *ngIf="role === 'EMPLOYEE'" class="hidden items-center gap-3 rounded-full border px-3 py-1 text-xs font-semibold uppercase tracking-[0.15em] lg:flex"
          [ngClass]="brandOn ? 'border-white/20 text-white/80' : 'border-slate-200 text-slate-600'">
          <a routerLink="/workspace" fragment="workspace" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Workspace</a>
          <span class="opacity-40">/</span>
          <a routerLink="/workspace" fragment="performance" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Performance</a>
        </div>

        <div *ngIf="role === 'ADMIN'" class="hidden items-center gap-2 rounded-full border px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] lg:flex"
          [ngClass]="brandOn ? 'border-white/15 text-white/80' : 'border-slate-200 text-slate-600'">
          <a routerLink="/admin" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Dashboard</a>
          <span class="opacity-40">/</span>
          <a routerLink="/hr/employees" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">People</a>
        </div>

        <div *ngIf="isHrRoute && (role === 'HR' || role === 'ADMIN')" class="hidden items-center gap-2 rounded-full border px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] lg:flex"
          [ngClass]="brandOn ? 'border-white/15 text-white/80' : 'border-slate-200 text-slate-600'">
          <a routerLink="/hr/employees" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Employees</a>
          <span class="opacity-40">/</span>
          <a routerLink="/hr/attendance" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Attendance</a>
          <span class="opacity-40">/</span>
          <a routerLink="/hr/leave" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Leave</a>
        </div>

        <div *ngIf="isFinanceRoute && (role === 'FINANCE' || role === 'ADMIN')" class="hidden items-center gap-2 rounded-full border px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] lg:flex"
          [ngClass]="brandOn ? 'border-white/15 text-white/80' : 'border-slate-200 text-slate-600'">
          <a routerLink="/finance/budgeting" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Budgets</a>
          <span class="opacity-40">/</span>
          <a routerLink="/finance/expenses" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Transactions</a>
          <span class="opacity-40">/</span>
          <a routerLink="/finance/invoices" class="rounded-full px-2 py-1 transition-colors"
            [ngClass]="brandOn ? 'text-primary-800 hover:bg-accent-yellow hover:text-primary-900' : 'text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">Invoices</a>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <label *ngIf="role" class="relative hidden items-center sm:flex" for="global-search">
        <span class="pointer-events-none absolute left-3.5 text-slate-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 21l-4.35-4.35M16 10.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <input
          id="global-search"
          type="search"
          placeholder="Search the workspace"
          class="w-72 rounded-full border px-4 py-2 pl-10 text-sm shadow-inner transition focus:outline-none"
          [ngClass]="'border-slate-200 bg-white text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary-100'"
        />
      </label>

      <a
        *ngIf="role && role !== 'EMPLOYEE'"
        href="https://konectadocumentsystem-nngw9z57s9b3nzdtyqfrzg.streamlit.app/"
        target="_blank"
        rel="noopener noreferrer"
        class="hidden items-center rounded-full border border-primary-200 bg-white/80 px-4 py-2 text-sm font-semibold text-primary-700 shadow-inner transition hover:bg-primary-50 sm:inline-flex"
      >
        Automated Document Processing
      </a>

      <div class="relative">
        <button *ngIf="role; else guestActions"
          type="button"
          class="flex h-12 w-12 items-center justify-center rounded-full bg-primary-500 text-sm font-black text-white shadow-lg shadow-primary-500/40 transition hover:translate-y-[-1px] hover:bg-accent-yellow hover:text-primary-900"
          (click)="toggleProfileMenu()"
          [attr.aria-expanded]="isProfileMenuOpen"
        >
          <span class="flex h-10 w-10 items-center justify-center rounded-full bg-white/15 text-white">{{ initials }}</span>
          <span class="sr-only">Profile menu</span>
        </button>

        <div *ngIf="isProfileMenuOpen" class="absolute right-0 z-50 mt-2 w-72 overflow-hidden rounded-2xl border shadow-2xl"
          [ngClass]="'border-slate-200 bg-white text-slate-900 ring-1 ring-slate-200/80'">
          <div class="border-b px-4 py-3" [ngClass]="'border-slate-200'">
            <p class="text-sm font-medium truncate" title="{{ email }}">{{ email }}</p>
          </div>
          <div class="p-3">
            <button type="button" (click)="onSignOutClick()" class="w-full rounded-xl px-4 py-2 text-sm font-semibold transition"
              [ngClass]="'bg-primary-600 text-white hover:bg-primary-700'">
              Sign out
            </button>
          </div>
        </div>
      </div>

      <ng-template #guestActions>
        <a routerLink="/auth/login" class="rounded-full border px-3 py-1.5 text-sm font-semibold transition"
          [ngClass]="'border-primary-200 text-primary-700 hover:bg-accent-yellow hover:text-primary-900'">
          Log in
        </a>
      </ng-template>
    </div>
  </div>
</nav>
