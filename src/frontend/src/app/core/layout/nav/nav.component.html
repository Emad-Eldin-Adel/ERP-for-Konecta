<nav
  class="fixed inset-x-0 top-0 z-50 grid items-center gap-x-5 px-6 py-3 shadow-sm border-b w-full"
  [ngClass]="[
    brandOn ? 'bg-primary-600 text-white nav--brand border-primary-600' : 'bg-white text-slate-900 border-slate-100',
    role ? 'grid-cols-[auto_minmax(280px,520px)_auto]' : 'grid-cols-[auto_1fr]'
  ]"
  aria-label="Global navigation"
>
  <div class="flex items-center gap-3">
    <a
      routerLink="/"
      class="group flex items-center gap-3 no-underline transition"
      [ngClass]="brandOn ? 'text-white' : 'text-primary-600'"
      aria-label="Konecta One home link"
    >
      <span
        class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-2xl border bg-white transition-all shadow-sm"
        [ngClass]="brandOn ? 'border-white/30 bg-white/20' : 'border-primary-100 group-hover:border-primary-200'"
      >
        <svg
          class="h-8 w-8"
          viewBox="0 0 64 64"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          role="img"
          aria-hidden="true"
        >
          <circle cx="32" cy="22" r="8"></circle>
          <path d="M22 42c0-5.523 4.477-10 10-10s10 4.477 10 10" fill="none"></path>
          <line x1="32" y1="6" x2="32" y2="14"></line>
          <line x1="48.97" y1="11.03" x2="43.66" y2="16.34"></line>
          <line x1="57" y1="28" x2="49" y2="28"></line>
          <line x1="48.97" y1="44.97" x2="43.66" y2="39.66"></line>
          <line x1="32" y1="58" x2="32" y2="50"></line>
          <line x1="15.03" y1="44.97" x2="20.34" y2="39.66"></line>
          <line x1="7" y1="28" x2="15" y2="28"></line>
          <line x1="15.03" y1="11.03" x2="20.34" y2="16.34"></line>
          <circle cx="32" cy="4" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="53" cy="28" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="32" cy="60" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="11" cy="28" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="48.5" cy="16" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="48.5" cy="40" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="15.5" cy="16" r="3" fill="currentColor" stroke="none"></circle>
          <circle cx="15.5" cy="40" r="3" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="flex flex-col leading-tight text-left">
        <span
          class="font-black tracking-tight"
          [ngClass]="brandOn ? 'text-white text-2xl sm:text-3xl' : 'text-slate-900 text-2xl sm:text-3xl'"
        >
          Konecta
        </span>
        <span
          class="font-black tracking-[0.12em]"
          [ngClass]="brandOn ? 'text-blue-200 text-lg sm:text-xl' : 'text-primary-600 text-lg sm:text-xl'"
        >
          ONE
        </span>
      </span>
    </a>
  </div>

  <label *ngIf="role" class="relative flex items-center justify-center w-full max-w-xl" for="global-search">
    <svg
      class="pointer-events-none absolute left-3.5 h-4 w-4 text-slate-400"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M21 21l-4.35-4.35M16 10.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
    <input
      id="global-search"
      type="search"
      placeholder="Search for a page"
      class="w-full rounded-full border border-slate-300 bg-white py-2 pl-10 pr-3 text-sm text-slate-900 placeholder:text-slate-400 shadow-inner focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200"
    />
  </label>

  <div class="flex items-center justify-end justify-self-end gap-2.5">
    <!-- Home/Auth quick links (top-right for guests) -->
    <ng-container *ngIf="!role && (isHomeRoute || isAuthRoute)">
      <a routerLink="/" class="text-sm font-medium hover:underline underline-offset-4 decoration-2 mr-6" [ngClass]="brandOn ? 'text-white decoration-white' : 'text-slate-900 decoration-slate-900'">Home</a>
      <a [routerLink]="['/']" fragment="about" class="text-sm font-medium hover:underline underline-offset-4 decoration-2 mr-6" [ngClass]="brandOn ? 'text-white decoration-white' : 'text-slate-900 decoration-slate-900'">About us</a>
    </ng-container>
    <!-- Employee primary nav buttons -->
    <div *ngIf="role === 'EMPLOYEE'" class="hidden md:flex items-center gap-6 mr-2 border-l border-white/30 pl-6">
      <a routerLink="/workspace" fragment="workspace" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Workspace</a>
      <a routerLink="/workspace" fragment="attendance" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Attendance</a>
      <a routerLink="/workspace" fragment="time-off" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Time off</a>
      <a routerLink="/workspace" fragment="performance" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Performance</a>
    </div>
    <!-- Admin primary nav buttons -->
    <div *ngIf="role === 'ADMIN'" class="hidden md:flex items-center gap-6 mr-2 border-l border-white/30 pl-6">
      <a routerLink="/admin" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Dashboard</a>
      <a routerLink="/hr/employees" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">People</a>
    </div>
    <!-- HR primary nav buttons -->
    <div *ngIf="isHrRoute && (role === 'HR' || role === 'ADMIN')" class="hidden md:flex items-center gap-6 mr-2 border-l border-white/30 pl-6">
      <a routerLink="/hr/employees" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Employees</a>
      <a routerLink="/hr/attendance" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Attendance</a>
      <a routerLink="/hr/leave" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Leave</a>
    </div>
    <!-- Finance primary nav buttons -->
    <div *ngIf="isFinanceRoute && (role === 'FINANCE' || role === 'ADMIN')" class="hidden md:flex items-center gap-6 mr-2 border-l border-white/30 pl-6">
      <a routerLink="/finance/budgeting" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Budgets</a>
      <a routerLink="/finance/expenses" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Transactions</a>
      <a routerLink="/finance/invoices" class="text-white text-sm font-medium hover:text-white hover:underline underline-offset-4 decoration-2 decoration-white">Invoices</a>
    </div>

    <!-- Chatbot CTA -->
    <a
      href="https://konecta-erp-chatbot-xbqmaly2xz8nfwe74kqc9r.streamlit.app/"
      target="_blank"
      rel="noopener noreferrer"
      class="hidden sm:inline-flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-semibold transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2"
      [ngClass]="brandOn ? 'border-white/40 text-white hover:bg-white/10 focus-visible:outline-white/80' : 'border-primary-200 text-primary-600 hover:bg-primary-50 focus-visible:outline-primary-400'"
    >
      <span aria-hidden="true" class="text-xs font-bold uppercase tracking-widest">AI</span>
      <span>Ask Konecta</span>
    </a>

    <!-- Profile menu -->
    <div class="relative top-nav__profile-wrapper">
      <button *ngIf="role; else guestActions"
        type="button"
        class="flex items-center gap-1 text-white p-0 transition hover:opacity-80"
        (click)="toggleProfileMenu()"
        aria-expanded="isProfileMenuOpen"
      >
        <span class="flex h-7 w-7 items-center justify-center rounded-full bg-white/20 text-white shadow-sm">
          {{ initials }}
        </span>
      </button>

      <div *ngIf="isProfileMenuOpen" class="absolute right-0 z-50 mt-2 w-70 rounded-2xl bg-white text-slate-900 shadow-lg ring-1 ring-black/5">
        <div class="px-4 py-3 border-b border-slate-200">
          <p class="text-sm font-medium whitespace-nowrap select-text" style="color:#000 !important" title="{{ email }}">{{ email }}</p>
        </div>
        <div class="p-3">
          <button type="button" (click)="onSignOutClick()" class="w-full rounded-lg bg-primary-600 px-4 py-2 text-center text-sm font-medium text-white hover:bg-primary-700">
            Sign out
          </button>
        </div>
      </div>
    </div>

    <!-- Guest actions when logged out -->
    <ng-template #guestActions>
      <a routerLink="/auth/login" class="text-sm font-medium hover:underline underline-offset-4 decoration-2 mr-6" [ngClass]="brandOn ? 'text-white decoration-white' : 'text-slate-900 decoration-slate-900'">Log in</a>
    </ng-template>
  </div>
</nav>
